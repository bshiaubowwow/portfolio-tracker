  function setTradesType(t) {
    tradesTypeFilter = t;
    renderTrades();
  }

  function setTradesTicker(t) {
    tradesTickerFilter = t;
    renderTrades();
  }

  function setTradesOptType(t) {
    tradesOptType = t;
    renderTrades();
  }

  function setTradesCustom() {
    tradesFrom   = document.getElementById('t-from').value;
    tradesTo     = document.getElementById('t-to').value;
    tradesPreset = 'custom';
    renderTrades();
  }


  function applyTradesFilterAgg(trades) {
    const now = new Date();
    let from = null;
    if (tradesPreset === '1w')  { from = new Date(now); from.setDate(from.getDate()-7); }
    else if (tradesPreset === '1m')  { from = new Date(now); from.setMonth(from.getMonth()-1); }
    else if (tradesPreset === '3m')  { from = new Date(now); from.setMonth(from.getMonth()-3); }
    else if (tradesPreset === 'ytd') { from = new Date(now.getFullYear(), 0, 1); }
    else if (tradesPreset === 'custom') {
      from = tradesFrom ? new Date(tradesFrom + 'T00:00:00') : null;
    }
    const to = (tradesPreset === 'custom' && tradesTo) ? new Date(tradesTo + 'T23:59:59') : null;
    return trades.filter(t => {
      const d = t.lastClose;
      if (from && d < from) return false;
      if (to   && d > to)   return false;
      return true;
    });
  }

  function renderRollingChart(trades) {
    if (trades.length < 10) return '';
    const WINDOW = 10;
    const metrics = {
      avgPnL: { label: 'Avg P&L', fn: function(slice) { return slice.length ? slice.reduce(function(s,t){return s+t.totalPnL},0)/slice.length : 0; }, fmt: function(v){return (v>=0?'+':'')+fmtN(v);} },
      winRate: { label: 'Win Rate', fn: function(slice) { var wins = slice.filter(function(t){return t.totalPnL>0}).length; return slice.length ? wins/slice.length*100 : 0; }, fmt: function(v){return v.toFixed(0)+'%';} },
      winLoss: { label: 'Win:Loss', fn: function(slice) { var w=slice.filter(function(t){return t.totalPnL>0}); var l=slice.filter(function(t){return t.totalPnL<0}); var avgW=w.length?w.reduce(function(s,t){return s+t.totalPnL},0)/w.length:0; var avgL=l.length?Math.abs(l.reduce(function(s,t){return s+t.totalPnL},0)/l.length):0; return avgL>0?avgW/avgL:0; }, fmt: function(v){return '1:'+v.toFixed(1);} },
    };
    var m = metrics[rollingMetric];
    var points = [];
    for (var i = WINDOW-1; i < trades.length; i++) {
      var slice = trades.slice(i-WINDOW+1, i+1);
      points.push({ idx: i, val: m.fn(slice) });
    }
    if (!points.length) return '';
    var options = Object.entries(metrics).map(function(e){return '<option value="'+e[0]+'"'+(e[0]===rollingMetric?' selected':'')+'>'+e[1].label+'</option>';}).join('');
    return '<div class="section-title">Rolling ' + WINDOW + ' Trades</div>' +
      '<div class="chart-wrap" style="padding:1.2rem 1.6rem">' +
        '<div style="margin-bottom:0.8rem"><select onchange="setRollingMetric(this.value)" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-family:var(--mono);font-size:0.78rem;padding:0.35rem 0.6rem;border-radius:3px;outline:none;cursor:pointer">' + options + '</select></div>' +
        '<canvas id="rolling-chart" style="display:block;width:100%"></canvas>' +
      '</div>';
  }

  function drawRollingChart(trades) {
    var canvas = document.getElementById('rolling-chart');
    if (!canvas || trades.length < 10) return;
    var WINDOW = 10;
    var metrics = {
      avgPnL: function(slice) { return slice.length ? slice.reduce(function(s,t){return s+t.totalPnL},0)/slice.length : 0; },
      winRate: function(slice) { var wins = slice.filter(function(t){return t.totalPnL>0}).length; return slice.length ? wins/slice.length*100 : 0; },
      winLoss: function(slice) { var w=slice.filter(function(t){return t.totalPnL>0}); var l=slice.filter(function(t){return t.totalPnL<0}); var avgW=w.length?w.reduce(function(s,t){return s+t.totalPnL},0)/w.length:0; var avgL=l.length?Math.abs(l.reduce(function(s,t){return s+t.totalPnL},0)/l.length):0; return avgL>0?avgW/avgL:0; },
    };
    var fmts = {
      avgPnL: function(v){return (v>=0?'+':'')+fmtN(v);},
      winRate: function(v){return v.toFixed(0)+'%';},
      winLoss: function(v){return '1:'+v.toFixed(1);},
    };
    var fn = metrics[rollingMetric];
    var fmt2 = fmts[rollingMetric];
    var points = [];
    for (var i = WINDOW-1; i < trades.length; i++) {
      points.push(fn(trades.slice(i-WINDOW+1, i+1)));
    }
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio||1;
    var W = canvas.offsetWidth, H = 240;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.height = H+'px';
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,W,H);

    var pad = {top:16,right:20,bottom:28,left:55};
    var cW = W-pad.left-pad.right, cH = H-pad.top-pad.bottom;
    var minV = Math.min(...points), maxV = Math.max(...points);
    var range = maxV-minV || 1;
    minV -= range*0.1; maxV += range*0.1; range = maxV-minV;
    var xP = function(i){return points.length>1 ? pad.left+(i/(points.length-1))*cW : pad.left+cW/2;};
    var yP = function(v){return pad.top+cH-((v-minV)/range)*cH;};

    // Grid
    var rawStep=range/4, mag=Math.pow(10,Math.floor(Math.log10(rawStep||1)));
    var gStep=Math.ceil(rawStep/mag)*mag || 1;
    var gStart=Math.ceil(minV/gStep)*gStep;
    ctx.strokeStyle='#252A3C'; ctx.lineWidth=1;
    for (var v=gStart; v<=maxV; v+=gStep) {
      var y=yP(v);
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cW,y); ctx.stroke();
      ctx.font='11px DM Mono,monospace'; ctx.fillStyle='#CDD2E0'; ctx.textAlign='right';
      ctx.fillText(fmt2(v), pad.left-6, y+4);
    }

    // Zero line for avgPnL
    if (rollingMetric === 'avgPnL' && minV < 0 && maxV > 0) {
      ctx.strokeStyle='#6B7390'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(pad.left,yP(0)); ctx.lineTo(pad.left+cW,yP(0)); ctx.stroke();
    }

    // Line
    ctx.beginPath(); ctx.strokeStyle='#FF4E1A'; ctx.lineWidth=2; ctx.lineJoin='round';
    points.forEach(function(v,i){i===0?ctx.moveTo(xP(i),yP(v)):ctx.lineTo(xP(i),yP(v));});
    ctx.stroke();

    // Dots
    ctx.fillStyle='#FF4E1A';
    points.forEach(function(v,i){ctx.beginPath();ctx.arc(xP(i),yP(v),2.5,0,Math.PI*2);ctx.fill();});

    // X labels
    var lStep = Math.max(1,Math.floor(points.length/5));
    ctx.font='11px DM Mono,monospace'; ctx.fillStyle='#CDD2E0'; ctx.textAlign='center';
    points.forEach(function(v,i){
      if (i%lStep===0||i===points.length-1) {
        ctx.fillText('#'+(i+WINDOW), xP(i), H-8);
      }
    });
  }

  function setBucketMetric(m) {
    bucketMetric = m;
    renderTrades();
  }

  function renderBucketAnalysis(trades) {
    if (!trades.length) return '';
    const metrics = {
      tradesPerDay: { label: 'Trades per Day', bucketFn: null, dynamicDay: true },
      sizePct: { label: 'Position Size', bucketFn: null, dynamic: true },
      tradeNumInDay: { label: 'Trade # in Day', bucketFn: null, dynamicTradeNum: true },
    };

    const metric = metrics[bucketMetric];
    const buckets = {};
    if (metric.dynamicTradeNum) {
      const dayGroups = {};
      trades.forEach(t => {
        const key = t.lastClose.toDateString();
        if (!dayGroups[key]) dayGroups[key] = [];
        dayGroups[key].push(t);
      });
      Object.values(dayGroups).forEach(dayTrades => {
        dayTrades.sort((a,b) => a.firstOpen - b.firstOpen);
      });
      const tradeIdx = new Map();
      Object.values(dayGroups).forEach(dayTrades => {
        dayTrades.forEach((t, i) => { tradeIdx.set(t, i + 1); });
      });
      const indices = trades.map(t => tradeIdx.get(t) || 1);
      const maxIdx = Math.max(...indices);
      if (maxIdx <= 1) { buckets['#1'] = trades.slice(); }
      else {
        const q1 = Math.ceil(maxIdx * 0.25);
        const q2 = Math.ceil(maxIdx * 0.5);
        const q3 = Math.ceil(maxIdx * 0.75);
        trades.forEach((t, i) => {
          const idx = indices[i];
          var label;
          if (q1 === q2 && q2 === q3) { label = '#' + idx; }
          else if (idx <= q1) label = '#1–' + q1;
          else if (idx <= q2) label = '#' + (q1+1) + '–' + q2;
          else if (idx <= q3) label = '#' + (q2+1) + '–' + q3;
          else label = '#' + (q3+1) + '+';
          if (!buckets[label]) buckets[label] = [];
          buckets[label].push(t);
        });
      }
    } else if (metric.dynamicDay) {
      const dayCounts = {};
      trades.forEach(t => {
        const key = t.lastClose.toDateString();
        if (!dayCounts[key]) dayCounts[key] = 0;
        dayCounts[key]++;
      });
      const counts = Object.values(dayCounts).sort((a,b) => a - b);
      if (!counts.length) return '';
      const q1 = counts[Math.floor(counts.length * 0.25)];
      const q2 = counts[Math.floor(counts.length * 0.5)];
      const q3 = counts[Math.floor(counts.length * 0.75)];
      trades.forEach(t => {
        const key = t.lastClose.toDateString();
        const dc = dayCounts[key];
        var label;
        if (q1 === q2 && q2 === q3) { label = dc + ' trades'; }
        else if (dc <= q1) label = '≤' + q1;
        else if (dc <= q2) label = (q1+1) + '–' + q2;
        else if (dc <= q3) label = (q2+1) + '–' + q3;
        else label = (q3+1) + '+';
        if (!buckets[label]) buckets[label] = [];
        buckets[label].push(t);
      });
    } else if (metric.dynamic) {
      const valid = trades.filter(t => t.sizePct !== null).sort((a,b) => a.sizePct - b.sizePct);
      if (!valid.length) return '';
      const q1 = valid[Math.floor(valid.length * 0.25)].sizePct;
      const q2 = valid[Math.floor(valid.length * 0.5)].sizePct;
      const q3 = valid[Math.floor(valid.length * 0.75)].sizePct;
      trades.forEach(t => {
        if (t.sizePct === null) return;
        var label;
        if (t.sizePct <= q1) label = '≤' + Math.round(q1*100) + '%';
        else if (t.sizePct <= q2) label = Math.round(q1*100) + '–' + Math.round(q2*100) + '%';
        else if (t.sizePct <= q3) label = Math.round(q2*100) + '–' + Math.round(q3*100) + '%';
        else label = Math.round(q3*100) + '%+';
        if (!buckets[label]) buckets[label] = [];
        buckets[label].push(t);
      });
    } else {
      trades.forEach(t => {
        const bucket = metric.bucketFn(t, trades);
        if (bucket === null) return;
        if (!buckets[bucket]) buckets[bucket] = [];
        buckets[bucket].push(t);
      });
    }

    const bucketOrder = Object.keys(buckets);
    const rows = bucketOrder.map(b => {
      const bTrades = buckets[b];
      const count = bTrades.length;
      const wins = bTrades.filter(t => t.totalPnL > 0).length;
      const winRate = count ? (wins / count * 100) : 0;
      const avgPnL = count ? bTrades.reduce((s,t) => s + t.totalPnL, 0) / count : 0;
      const totalPnL = bTrades.reduce((s,t) => s + t.totalPnL, 0);
      return { bucket: b, count, winRate, avgPnL, totalPnL };
    });

    const options = Object.entries(metrics).map(([k,v]) =>
      '<option value="' + k + '"' + (k === bucketMetric ? ' selected' : '') + '>' + v.label + '</option>'
    ).join('');

    return `<div class="section-title">Performance by Factor</div>
    <div style="margin-bottom:0.8rem">
      <select onchange="setBucketMetric(this.value)" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-family:var(--mono);font-size:0.78rem;padding:0.35rem 0.6rem;border-radius:3px;outline:none;cursor:pointer">
        ${options}
      </select>
    </div>
    <div class="trades-table-wrap">
      <table class="trades-table">
        <thead><tr>
          <th>${metric.label}</th><th>Trades</th><th>Win Rate</th><th>Avg P&L</th><th>Total P&L</th>
        </tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td style="color:var(--text-1);font-weight:500">${r.bucket}</td>
          <td>${r.count}</td>
          <td class="${r.winRate>=50?'pos':'neg'}">${r.winRate.toFixed(0)}%</td>
          <td class="${cls(r.avgPnL)}">${fmtS(r.avgPnL)}</td>
          <td class="${cls(r.totalPnL)}">${fmtS(r.totalPnL)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  function renderTimeOfDay(trades) {
    const dayTrades = trades.filter(t => t.daysHeld === 0);
    if (!dayTrades.length) return '';
    const bySlot = {};
    dayTrades.forEach(t => {
      const d = parseTradeDate(t.openTime);
      if (isNaN(d)) return;
      // Webull times are ET — subtract 3 hours for PT
      let hr = d.getHours() - 3;
      if (hr < 0) hr += 24;
      const min = d.getMinutes();
      const slot = hr * 2 + (min >= 30 ? 1 : 0);
      if (!bySlot[slot]) bySlot[slot] = [];
      bySlot[slot].push(t);
    });
    const allSlots = Object.keys(bySlot).map(Number).sort((a,b) => a - b);
    if (!allSlots.length) return '';
    function slotLabel(slot) {
      const hr = Math.floor(slot / 2);
      const min = (slot % 2) * 30;
      const h = hr > 12 ? hr - 12 : hr === 0 ? 12 : hr;
      const ampm = hr >= 12 ? 'p' : 'a';
      return h + ':' + String(min).padStart(2,'0') + ampm;
    }
    const rows = allSlots.map(slot => {
      const sTrades = bySlot[slot] || [];
      const count = sTrades.length;
      const wins = sTrades.filter(t => t.totalPnL > 0).length;
      const winRate = count ? (wins / count * 100) : 0;
      const avgPnL = count ? sTrades.reduce((s,t) => s + t.totalPnL, 0) / count : null;
      const totalPnL = sTrades.reduce((s,t) => s + t.totalPnL, 0);
      const label = slotLabel(slot) + ' – ' + slotLabel(slot + 1);
      return { slot, label, count, winRate, avgPnL, totalPnL, empty: count === 0 };
    });
    return `<div class="section-title">Performance by Time of Day <span style="font-size:0.65rem;color:var(--text-3);letter-spacing:0.06em;text-transform:none">(Day Trades — entry time, PT)</span></div>
    <div class="trades-table-wrap">
      <table class="trades-table">
        <thead><tr>
          <th>Time</th><th>Trades</th><th>Win Rate</th><th>Avg P&L</th><th>Total P&L</th>
        </tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td style="color:var(--text-1);font-weight:500">${r.label}</td>
          <td>${r.count}</td>
          <td class="${r.winRate>=50?'pos':'neg'}">${r.winRate.toFixed(0)}%</td>
          <td class="${r.avgPnL!==null?cls(r.avgPnL):''}">${r.avgPnL!==null ? fmtS(r.avgPnL) : '—'}</td>
          <td class="${cls(r.totalPnL)}">${fmtS(r.totalPnL)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  function drawTodChart(rows) {
    const canvas = document.getElementById('tod-chart');
    if (!canvas || !rows.length) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth, H = 300;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const pad = { top: 20, right: 20, bottom: 36, left: 65 };
    const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;

    const vals = rows.map(r => r.avgPnL || 0);
    const maxAbs = Math.max(10, ...vals.map(Math.abs));
    const rawStep = maxAbs / 2;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const maxV = Math.ceil(maxAbs / mag) * mag;

    const zeroY = pad.top + cH / 2;
    const yP = v => zeroY - (v / maxV) * (cH / 2);

    const barW = Math.min(50, cW / rows.length * 0.65);
    const step = cW / rows.length;

    // Gridlines
    ctx.strokeStyle = '#252A3C'; ctx.lineWidth = 1;
    const gridVals = [];
    for (let v = -maxV; v <= maxV; v += maxV / 2) gridVals.push(v);
    gridVals.forEach(v => {
      const y = yP(v);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cW, y); ctx.stroke();
    });

    // Zero line
    ctx.strokeStyle = '#6B7390'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.left, zeroY); ctx.lineTo(pad.left + cW, zeroY); ctx.stroke();

    // Y labels
    ctx.font = '11px DM Mono,monospace'; ctx.fillStyle = '#CDD2E0'; ctx.textAlign = 'right';
    gridVals.forEach(v => {
      if (v === 0) return;
      ctx.fillText(fmtN(v), pad.left - 8, yP(v) + 4);
    });
    ctx.fillText('$0', pad.left - 8, zeroY + 4);

    // Bars
    rows.forEach((r, i) => {
      const x = pad.left + step * i + (step - barW) / 2;
      const val = r.avgPnL || 0;
      const color = val >= 0 ? '#22C55E' : '#EF4444';
      const y = yP(val);
      ctx.fillStyle = color;
      if (val >= 0) {
        ctx.fillRect(x, y, barW, zeroY - y);
      } else {
        ctx.fillRect(x, zeroY, barW, y - zeroY);
      }

      // Data label on bar
      if (r.avgPnL !== null) {
        const labelY = val >= 0 ? y - 6 : y + 12;
        ctx.font = '10px DM Mono,monospace'; ctx.fillStyle = color; ctx.textAlign = 'center';
        ctx.fillText(fmtS(val), x + barW / 2, labelY);
      }

      // X label
      ctx.font = '11px DM Mono,monospace'; ctx.fillStyle = '#CDD2E0'; ctx.textAlign = 'center';
      ctx.fillText(r.label, x + barW / 2, H - 10);
    });
  }

  function renderTradeLog(trades) {
    if (!trades.length) return '';
    function fmtSizePct(p) { return p !== null ? Math.round(p * 100) + '%' : '—'; }
    function fmtDt(s) {
      if (!s) return '—';
      var d = new Date(s.replace(/\s+[A-Z]{2,4}$/, ''));
      if (isNaN(d)) return s.slice(0,10);
      return (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
    }

    const sortKeys = {
      result: t => t.totalPnL > 0 ? 1 : t.totalPnL < 0 ? -1 : 0,
      style: t => t.daysHeld > 0 ? 1 : 0,
      underlying: t => t.parsed.underlying,
      type: t => t.parsed.type,
      strike: t => t.parsed.strike,
      expiry: t => t.parsed.expiry,
      qty: t => t.totalQty,
      cost: t => t.totalCost,
      pnl: t => t.totalPnL,
      pnlPct: t => t.pnlPct,
      sizePct: t => t.sizePct || 0,
      openTime: t => t.firstOpen,
      closeTime: t => t.lastClose,
      days: t => t.daysHeld,
    };

    const sorted = [...trades].sort(function(a, b) {
      const fn = sortKeys[tradeLogSort.key] || sortKeys.closeTime;
      const av = fn(a), bv = fn(b);
      if (av < bv) return -1 * tradeLogSort.dir;
      if (av > bv) return 1 * tradeLogSort.dir;
      return 0;
    });

    function sortTh(label, key) {
      const arrow = tradeLogSort.key === key ? (tradeLogSort.dir > 0 ? ' ▲' : ' ▼') : '';
      return '<th style="cursor:pointer" onclick="setTradeLogSort(\'' + key + '\')">' + label + arrow + '</th>';
    }

    return '<div class="section-title">Trade Log</div>' +
    '<div class="trade-log-wrap">' +
      '<table class="trades-table">' +
        '<thead><tr>' +
          sortTh('Opened', 'openTime') + sortTh('W/L', 'result') + sortTh('Style', 'style') +
          sortTh('Underlying', 'underlying') + sortTh('Type', 'type') + sortTh('Strike', 'strike') + sortTh('Expiry', 'expiry') +
          sortTh('P&L', 'pnl') + sortTh('P&L %', 'pnlPct') + sortTh('Size %', 'sizePct') +
          sortTh('Cost Basis', 'cost') + sortTh('Qty', 'qty') +
          sortTh('Closed', 'closeTime') + sortTh('Time Held', 'days') +
        '</tr></thead>' +
        '<tbody>' + sorted.map(function(t) {
          var wl = t.totalPnL > 0 ? '<span class="pos">W</span>' : t.totalPnL < 0 ? '<span class="neg">L</span>' : '—';
          var style = t.daysHeld > 0 ? '<span class="badge" style="background:rgba(167,139,250,0.2);color:#C4B5FD">Swing</span>' : '<span class="badge" style="background:rgba(255,78,26,0.15);color:var(--orange)">Day</span>';
          return '<tr>' +
          '<td>' + fmtDt(t.openTime) + '</td>' +
          '<td>' + wl + '</td>' +
          '<td>' + style + '</td>' +
          '<td style="color:var(--text-1);font-weight:500">' + t.parsed.underlying + '</td>' +
          '<td><span class="badge ' + (t.parsed.type==='Call'?'badge-call':'badge-put') + '">' + t.parsed.type + '</span></td>' +
          '<td>$' + t.parsed.strike.toFixed(0) + '</td>' +
          '<td>' + t.parsed.expiryDisplay + '</td>' +
          '<td class="' + cls(t.totalPnL) + '">' + fmtS(t.totalPnL) + '</td>' +
          '<td class="' + cls(t.pnlPct) + '">' + (t.pnlPct >= 0 ? '+' : '') + t.pnlPct.toFixed(0) + '%</td>' +
          '<td>' + fmtSizePct(t.sizePct) + '</td>' +
          '<td>' + fmt(t.totalCost) + '</td>' +
          '<td>' + t.totalQty + '</td>' +
          '<td>' + fmtDt(t.closeTime) + '</td>' +
          '<td>' + (function(ms){if(!ms)return'0m';var m=ms/60000;if(m<60)return Math.round(m)+'m';var h=m/60;if(h<24)return h.toFixed(1)+'h';return Math.round(h/24)+'d'})(t.holdMs) + '</td>' +
        '</tr>'; }).join('') +
        '</tbody>' +
      '</table>' +
    '</div>';
  }

  function applyTradesFilter() {
    const now = new Date();
    let from = null;
    if (tradesPreset === '1w')  { from = new Date(now); from.setDate(from.getDate()-7); }
    else if (tradesPreset === '1m')  { from = new Date(now); from.setMonth(from.getMonth()-1); }
    else if (tradesPreset === '3m')  { from = new Date(now); from.setMonth(from.getMonth()-3); }
    else if (tradesPreset === 'ytd') { from = new Date(now.getFullYear(), 0, 1); }
    else if (tradesPreset === 'custom') {
      from = tradesFrom ? new Date(tradesFrom + 'T00:00:00') : null;
    }
    const to = (tradesPreset === 'custom' && tradesTo) ? new Date(tradesTo + 'T23:59:59') : null;

    const filterDate = (dateStr) => {
      const d = parseTradeDate(dateStr);
      if (from && d < from) return false;
      if (to   && d > to)   return false;
      return true;
    };
    return {
      closed: _tradesData.closed.filter(t => filterDate(t.closeTime)),
      open:   _tradesData.open,
    };
  }

  let tradesPnlUnit = '$'; // '$' | '%'
  let rollingMetric = 'avgPnL'; // 'avgPnL' | 'winRate' | 'winLoss'
  let mcTrades = 50; // Monte Carlo projection trades

  function setMcTrades(n) {
    mcTrades = parseInt(n) || 50;
    renderTrades();
  }

  function setRollingMetric(m) {
    rollingMetric = m;
    renderTrades();
  }
  let bucketMetric = 'tradesPerDay'; // 'tradesPerDay' | 'sizePct' | 'tradeNumInDay'

  function setTradesPnlUnit(u) {
    tradesPnlUnit = u;
    renderTrades();
  }

  function renderTrades() {
    let { closed, open } = applyTradesFilter();
    const trades = aggregateByContract(_tradesData);
    let filteredTrades = applyTradesFilterAgg(trades);

    // Apply type filter (day/swing)
    if (tradesTypeFilter !== 'all') {
      filteredTrades = filteredTrades.filter(t => tradesTypeFilter === 'day' ? t.daysHeld === 0 : t.daysHeld > 0);
      const symbols = new Set(filteredTrades.map(t => t.symbol));
      closed = closed.filter(t => symbols.has(t.symbol));
    }
    // Apply ticker filter
    if (tradesTickerFilter !== 'all') {
      filteredTrades = filteredTrades.filter(t => t.parsed.underlying === tradesTickerFilter);
      const symbols = new Set(filteredTrades.map(t => t.symbol));
      closed = closed.filter(t => symbols.has(t.symbol));
    }
    // Apply option type filter (call/put)
    if (tradesOptType !== 'all') {
      const typeMatch = tradesOptType === 'call' ? 'Call' : 'Put';
      filteredTrades = filteredTrades.filter(t => t.parsed.type === typeMatch);
      const symbols = new Set(filteredTrades.map(t => t.symbol));
      closed = closed.filter(t => symbols.has(t.symbol));
    }

    const wrap = document.getElementById('trades-content');
    if (!wrap) return;

    // Build ticker list from all trades (pre-filter) for pills
    const allTickers = [...new Set(trades.map(t => t.parsed.underlying))].sort();

    const presets = ['1w','1m','3m','ytd','all'];
    const presetLabels = { '1w':'1W','1m':'1M','3m':'3M','ytd':'YTD','all':'All' };
    const typeFilters = ['all','day','swing'];
    const typeLabels = { all:'All', day:'Day', swing:'Swing' };
    const optTypes = ['all','call','put'];
    const optLabels = { all:'All', call:'Calls', put:'Puts' };
    // Compute effective date range for display
    let displayFrom = tradesFrom, displayTo = tradesTo;
    if (tradesPreset !== 'custom' && filteredTrades.length) {
      const first = filteredTrades[0];
      const last = filteredTrades[filteredTrades.length - 1];
      function toDateStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
      displayFrom = toDateStr(first.firstOpen);
      displayTo = toDateStr(last.lastClose);
    }

    const filterBar = `
      <div class="trades-filter" style="flex-wrap:wrap;gap:0.5rem 0.6rem">
        ${presets.map(p => `<button class="pill${tradesPreset===p?' active':''}" onclick="setTradesPreset('${p}')">${presetLabels[p]}</button>`).join('')}
        <span class="sep">|</span>
        <input class="date-input" type="date" id="t-from" value="${displayFrom}" onchange="setTradesCustom()" />
        <span class="sep">→</span>
        <input class="date-input" type="date" id="t-to" value="${displayTo}" onchange="setTradesCustom()" />
        <span class="sep">|</span>
        ${typeFilters.map(t => `<button class="pill${tradesTypeFilter===t?' active':''}" onclick="setTradesType('${t}')">${typeLabels[t]}</button>`).join('')}
        <span class="sep">|</span>
        ${optTypes.map(t => `<button class="pill${tradesOptType===t?' active':''}" onclick="setTradesOptType('${t}')">${optLabels[t]}</button>`).join('')}
        ${allTickers.length > 1 ? `<span class="sep">|</span>
        <button class="pill${tradesTickerFilter==='all'?' active':''}" onclick="setTradesTicker('all')">All Tickers</button>
        ${allTickers.map(t => `<button class="pill${tradesTickerFilter===t?' active':''}" onclick="setTradesTicker('${t}')">${t}</button>`).join('')}` : ''}
      </div>`;

    // Summary stats (contract-level)
    const totalPnL = filteredTrades.reduce((s,t) => s+t.totalPnL, 0);
    const winners  = filteredTrades.filter(t => t.totalPnL > 0);
    const losers   = filteredTrades.filter(t => t.totalPnL < 0);
    const winRate  = filteredTrades.length ? (winners.length/filteredTrades.length*100) : 0;
    const avgWin$  = winners.length ? winners.reduce((s,t) => s + t.totalPnL, 0) / winners.length : 0;
    const avgLoss$ = losers.length ? Math.abs(losers.reduce((s,t) => s + t.totalPnL, 0) / losers.length) : 0;
    const rrNum    = avgLoss$ > 0 ? avgWin$ / avgLoss$ : null;
    const rrRatio  = rrNum !== null ? '1:' + rrNum.toFixed(1) : '—';
    const breakeven = rrNum !== null ? (1 / (1 + rrNum)) * 100 : null;
    const expectancy = filteredTrades.length ? (winRate/100 * avgWin$) + ((1 - winRate/100) * -avgLoss$) : null;
    const startBalance = filteredTrades.length ? (function() { var d = lookupDaily(filteredTrades[0].openTime); return d ? d.balance : null; })() : null;
    const acctReturn = startBalance ? (totalPnL / startBalance) * 100 : null;

    const RECENT_N = 10;
    const tStats = buildTradeStats(filteredTrades);
    const recentTrades = filteredTrades.slice(-RECENT_N);
    const tStatsRecent = buildTradeStats(recentTrades);
    const discStats   = buildDisciplineStats(filteredTrades);
    const discStatsRecent = buildDisciplineStats(recentTrades);

    // Cumulative chart data (aggregated by day)
    let cumVal = 0;
    const byDay = {};
    filteredTrades.forEach(t => {
      const d = t.lastClose;
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      if (!byDay[key]) byDay[key] = { date: d, trades: [], dayPnL: 0, wins: 0 };
      byDay[key].dayPnL += t.totalPnL;
      byDay[key].trades.push(t);
      if (t.totalPnL > 0) byDay[key].wins++;
    });
    const cumData = Object.keys(byDay).sort().map(key => {
      const day = byDay[key];
      let dayVal;
      if (tradesPnlUnit === '%' && startBalance) dayVal = (day.dayPnL / startBalance) * 100;
      else dayVal = day.dayPnL;
      cumVal += dayVal;
      return { date: day.date, cum: cumVal, count: day.trades.length, dayPnL: day.dayPnL, wins: day.wins };
    });

    function fmtDate2(s) {
      if (!s) return '—';
      const d = s instanceof Date ? s : new Date(String(s).replace(/\s+[A-Z]{2,4}$/, ''));
      if (isNaN(d)) return '—';
      return (d.getMonth()+1) + '/' + d.getDate();
    }
    function fmtDt(s) { return s ? s.slice(0,10) : '—'; }
    function fmtSizePct(p) { return p !== null ? Math.round(p * 100) + '%' : '—'; }

    function warnCls(recent, allTime, worse) {
      if (recent === null || allTime === null) return '';
      return worse(recent, allTime) ? 'neg' : '';
    }

    function compRow(label, allVal, recentVal, format, worseCheck) {
      let deltaHtml = '—';
      if (recentVal !== null && allVal !== null && typeof recentVal === 'number' && typeof allVal === 'number') {
        const diff = recentVal - allVal;
        if (diff !== 0) {
          const arrow = diff > 0 ? '▲' : '▼';
          const isWorse = worseCheck && worseCheck(recentVal, allVal);
          const dCls = isWorse ? 'neg' : 'pos';
          deltaHtml = '<span class="' + dCls + '">' + arrow + '</span>';
        } else {
          deltaHtml = '—';
        }
      }
      return `<tr>
        <td style="color:var(--text-1);font-weight:500">${label}</td>
        <td>${format(allVal)}</td>
        <td>${format(recentVal)}</td>
        <td style="text-align:center">${deltaHtml}</td>
      </tr>`;
    }

    const sizingHtml = filteredTrades.length > 0 ? `
      <div class="section-title">Sizing <span style="font-size:0.65rem;color:var(--text-3);letter-spacing:0.06em;text-transform:none">(All vs Last ${RECENT_N})</span></div>
      <div class="trades-table-wrap">
        <table class="trades-table">
          <thead><tr>
            <th>Metric</th><th>All (${filteredTrades.length})</th><th>Last ${Math.min(RECENT_N, filteredTrades.length)}</th><th style="text-align:center">Δ</th>
          </tr></thead>
          <tbody>
            ${compRow('Avg Size %', tStats.avgSize, tStatsRecent.avgSize, fmtSizePct, function(r,a){return r>a*1.3})}
            ${compRow('Max Size %', tStats.maxSize, tStatsRecent.maxSize, fmtSizePct, function(r,a){return r>a*1.3})}
            ${compRow('Avg Size (Win)', tStats.avgSizeWin, tStatsRecent.avgSizeWin, fmtSizePct, function(r,a){return r<a})}
            ${compRow('Avg Size (Loss)', tStats.avgSizeLoss, tStatsRecent.avgSizeLoss, fmtSizePct, function(r,a){return r>a*1.3})}
          </tbody>
        </table>
      </div>` : `
      <div class="section-title">Sizing</div>
      <div class="trades-summary">
        <div class="tstat"><span class="tstat-label">Avg Size %</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Max Size %</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Avg Size (Win)</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Avg Size (Loss)</span><span class="tstat-val">—</span></div>
      </div>`;

    function fmtHold(ms) {
      if (ms === null) return '—';
      var mins = ms / 60000;
      if (mins < 60) return Math.round(mins) + 'm';
      var hrs = mins / 60;
      if (hrs < 24) return hrs.toFixed(1) + 'h';
      var days = hrs / 24;
      return days.toFixed(1) + 'd';
    }
    function fmtFreq(f) { return f !== null ? f.toFixed(1) + '/wk' : '—'; }
    function fmtDD(s) { return s && s.maxDD ? fmtS(-s.maxDD) : '—'; }

    const discHtml = filteredTrades.length > 0 ? `
      <div class="section-title">Discipline <span style="font-size:0.65rem;color:var(--text-3);letter-spacing:0.06em;text-transform:none">(All vs Last ${RECENT_N})</span></div>
      <div class="trades-table-wrap">
        <table class="trades-table">
          <thead><tr>
            <th>Metric</th><th>All (${filteredTrades.length})</th><th>Last ${Math.min(RECENT_N, filteredTrades.length)}</th><th style="text-align:center">Δ</th>
          </tr></thead>
          <tbody>
            ${compRow('Max Drawdown', discStats, discStatsRecent, fmtDD, null)}
            ${compRow('Max Loss Streak', discStats.maxStreak, discStatsRecent.maxStreak, function(v){return v!=null?v.toString():'—'}, function(r,a){return r>a})}
            ${compRow('Avg Hold (Win)', discStats.avgHoldWin, discStatsRecent.avgHoldWin, fmtHold, null)}
            ${compRow('Avg Hold (Loss)', discStats.avgHoldLoss, discStatsRecent.avgHoldLoss, fmtHold, function(r,a){return r>a*1.3})}
            ${compRow('Trade Freq', discStats.tradesPerWeek, discStatsRecent.tradesPerWeek, fmtFreq, function(r,a){return r>a*1.5})}
          </tbody>
        </table>
      </div>` : `
      <div class="section-title">Discipline</div>
      <div class="trades-summary">
        <div class="tstat"><span class="tstat-label">Max Drawdown</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Avg Hold (Win)</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Avg Hold (Loss)</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Trade Freq</span><span class="tstat-val">—</span></div>
        <div class="tstat"><span class="tstat-label">Max Loss Streak</span><span class="tstat-val">—</span></div>
      </div>`;

    // Daily scorecard — today's stats
    const today = new Date();
    const todayTrades = filteredTrades.filter(t => {
      const d = t.lastClose;
      return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
    });
    const todayPnL = todayTrades.reduce((s,t) => s + t.totalPnL, 0);
    const todayWins = todayTrades.filter(t => t.totalPnL > 0).length;
    const todayWR = todayTrades.length ? (todayWins / todayTrades.length * 100) : 0;
    const todayBalance = _dailyData && _dailyData.length ? _dailyData[_dailyData.length-1].balance : null;
    const todayReturnPct = todayBalance ? (todayPnL / todayBalance * 100) : null;

    const scorecardHtml = `
      <div class="section-title">Today</div>
      <div class="trades-summary">
        <div class="tstat"><span class="tstat-label">P&L</span><span class="tstat-val ${cls(todayPnL)}">${fmtS(todayPnL)}${todayReturnPct !== null ? ' <span style="opacity:0.65;font-size:0.82rem">(' + (todayReturnPct>=0?'+':'') + todayReturnPct.toFixed(1) + '%)</span>' : ''}</span></div>
        <div class="tstat"><span class="tstat-label">Trades</span><span class="tstat-val">${todayTrades.length}</span></div>
        <div class="tstat"><span class="tstat-label">Win Rate</span><span class="tstat-val ${todayTrades.length ? (todayWR>=50?'pos':'neg') : ''}">${todayTrades.length ? todayWR.toFixed(0) + '%' : '—'}</span></div>
      </div>`;

    wrap.innerHTML = `
      ${filterBar}
      ${scorecardHtml}
      <div class="section-title">Edge</div>
      <div class="trades-summary">
        <div class="tstat"><span class="tstat-label">Total P&L</span><span class="tstat-val ${cls(totalPnL)}">${fmtS(totalPnL)}${acctReturn !== null ? ' <span style="opacity:0.65;font-size:0.82rem">(' + (acctReturn>=0?'+':'') + acctReturn.toFixed(1) + '%)</span>' : ''}</span></div>
        <div class="tstat"><span class="tstat-label">Expectancy</span><span class="tstat-val ${expectancy !== null ? cls(expectancy) : ''}">${expectancy !== null ? fmtS(expectancy) : '—'}<span style="opacity:0.65;font-size:0.75rem"> /trade</span></span></div>
        <div class="tstat"><span class="tstat-label">Win Rate</span><span class="tstat-val ${winRate>=50?'pos':'neg'}">${winRate.toFixed(1)}%</span></div>
        <div class="tstat"><span class="tstat-label">Avg Win</span><span class="tstat-val pos">${avgWin$ ? fmtS(avgWin$) : '—'}</span></div>
        <div class="tstat"><span class="tstat-label">Avg Loss</span><span class="tstat-val neg">${avgLoss$ ? fmtS(-avgLoss$) : '—'}</span></div>
        <div class="tstat"><span class="tstat-label">Win:Loss</span><span class="tstat-val">${rrRatio}</span></div>
        <div class="tstat"><span class="tstat-label">Breakeven WR</span><span class="tstat-val">${breakeven !== null ? breakeven.toFixed(1) + '%' : '—'}</span></div>
        <div class="tstat"><span class="tstat-label">Trades</span><span class="tstat-val">${filteredTrades.length}</span></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start">
        <div>${sizingHtml}</div>
        <div>${discHtml}</div>
      </div>

      <div class="chart-wrap" style="padding:1.2rem 1.6rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem">
          <div class="section-title" style="margin:0">Equity Curve</div>
          <div style="display:flex;gap:0.35rem;align-items:center">
            <button class="pill${tradesPnlUnit==='$'?' active':''}" onclick="setTradesPnlUnit('$')" style="font-size:0.72rem;padding:0.25rem 0.6rem">$</button>
            <button class="pill${tradesPnlUnit==='%'?' active':''}" onclick="setTradesPnlUnit('%')" style="font-size:0.72rem;padding:0.25rem 0.6rem">%</button>
          </div>
        </div>
        <div style="position:relative">
          <canvas id="trades-chart" style="display:block;width:100%"></canvas>
          <div id="eq-tooltip" style="display:none;position:absolute;background:#1C2133;border:1px solid var(--border);border-radius:4px;padding:0.6rem 0.8rem;font-family:var(--mono);font-size:0.75rem;pointer-events:none;z-index:10;min-width:160px"></div>
        </div>
      </div>


      ${renderRollingChart(filteredTrades)}
      ${renderBucketAnalysis(filteredTrades)}
      ${renderTimeOfDay(filteredTrades)}

      ${open.length > 0 ? '<div class="section-title">Open Positions <span class="badge badge-open" style="font-size:0.7rem;vertical-align:middle">' + open.length + '</span></div>' +
      '<div class="trades-table-wrap"><table class="trades-table"><thead><tr>' +
      '<th>Underlying</th><th>Type</th><th>Strike</th><th>Expiry</th><th>Qty</th><th>Avg Entry</th><th>Total Cost</th><th>Opened</th><th>Days Held</th>' +
      '</tr></thead><tbody>' + open.map(function(t) {
        var days = Math.round((Date.now() - parseTradeDate(t.openTime)) / 86400000);
        return '<tr>' +
          '<td style="color:var(--text-1);font-weight:500">' + t.parsed.underlying + '</td>' +
          '<td><span class="badge ' + (t.parsed.type==='Call'?'badge-call':'badge-put') + '">' + t.parsed.type + '</span></td>' +
          '<td>$' + t.parsed.strike.toFixed(0) + '</td>' +
          '<td>' + t.parsed.expiryDisplay + '</td>' +
          '<td>' + t.qty + '</td>' +
          '<td>$' + t.entryPrice.toFixed(2) + '</td>' +
          '<td class="neg">-' + fmt(t.totalCost) + '</td>' +
          '<td>' + fmtDt(t.openTime) + '</td>' +
          '<td>' + days + 'd</td></tr>';
      }).join('') + '</tbody></table></div>' : ''}

      ${renderTradeLog(filteredTrades)}`;

    // Draw charts
    setTimeout(() => {
      drawRollingChart(filteredTrades);
      const canvas = document.getElementById('trades-chart');
      if (!canvas || cumData.length < 1) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio||1;
      const W = canvas.offsetWidth, H = 360;
      canvas.width = W*dpr; canvas.height = H*dpr;
      canvas.style.height = H+'px';
      ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,W,H);

      const pad = {top:12,right:20,bottom:28,left:80};
      const cW = W-pad.left-pad.right, cH = H-pad.top-pad.bottom;

      // Monte Carlo simulation from trade 0 (same length as actual data, per-day)
      // Use ALL-TIME daily values for MC/EV so filtered views compare against long-term baseline
      const MC_PATHS = 200;
      const mcPool = [];
      const allTradesForMC = aggregateByContract(_tradesData);
      const allByDay = {};
      allTradesForMC.forEach(t => {
        const d = t.lastClose;
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (!allByDay[key]) allByDay[key] = { dayPnL: 0 };
        allByDay[key].dayPnL += t.totalPnL;
      });
      Object.keys(allByDay).sort().forEach(key => {
        const day = allByDay[key];
        if (tradesPnlUnit === '%' && startBalance) mcPool.push(day.dayPnL / startBalance * 100);
        else mcPool.push(day.dayPnL);
      });
      const mcN = cumData.length;
      const mcPaths = [];
      if (mcPool.length >= 2 && mcN > 1) {
        for (var p = 0; p < MC_PATHS; p++) {
          var path = [0];
          var cum = 0;
          for (var j = 0; j < mcN; j++) {
            cum += mcPool[Math.floor(Math.random() * mcPool.length)];
            path.push(cum);
          }
          mcPaths.push(path);
        }
      }

      // Compute percentile bands
      var mcBands = [];
      if (mcPaths.length) {
        for (var j = 0; j <= mcN; j++) {
          var vals_j = mcPaths.map(function(p){return p[j]}).sort(function(a,b){return a-b});
          mcBands.push({
            p10: vals_j[Math.floor(vals_j.length*0.1)],
            p25: vals_j[Math.floor(vals_j.length*0.25)],
            p50: vals_j[Math.floor(vals_j.length*0.5)],
            p75: vals_j[Math.floor(vals_j.length*0.75)],
            p90: vals_j[Math.floor(vals_j.length*0.9)],
          });
        }
      }

      // Expected value line (avg per trade × N)
      const avgPerTrade = mcPool.length ? mcPool.reduce(function(s,v){return s+v},0) / mcPool.length : 0;

      const totalPoints = cumData.length;
      const vals = cumData.map(d => d.cum);
      const evMax = avgPerTrade * (cumData.length - 1);
      const mcAllVals = mcBands.length ? mcBands.flatMap(b => [b.p10, b.p90]) : [evMax];
      const allVals = [...vals, ...mcAllVals];
      const minV = Math.min(0, ...allVals), maxV = Math.max(0, ...allVals);
      const range = maxV-minV || 1;
      const xP = i => totalPoints > 1 ? pad.left + (i/(totalPoints-1))*cW : pad.left + cW/2;
      const yP = v => pad.top  + cH - ((v-minV)/range)*cH;

      // Zero line
      if (minV < 0 && maxV > 0) {
        const y0 = yP(0);
        ctx.strokeStyle='#6B7390'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(pad.left,y0); ctx.lineTo(pad.left+cW,y0); ctx.stroke();
      }

      // Grid
      const rawStep = range/4, mag = Math.pow(10,Math.floor(Math.log10(rawStep)));
      const gStep = Math.ceil(rawStep/mag)*mag;
      const gStart = Math.ceil(minV/gStep)*gStep;
      ctx.strokeStyle='#252A3C'; ctx.lineWidth=1;
      for (let v=gStart; v<=maxV; v+=gStep) {
        const y=yP(v);
        ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cW,y); ctx.stroke();
        ctx.font='12px DM Mono,monospace'; ctx.fillStyle='#CDD2E0'; ctx.textAlign='right';
        const yLabel = tradesPnlUnit === '%' ? v.toFixed(1) + '%' : fmtN(v);
        ctx.fillText(yLabel, pad.left-6, y+4);
      }

      // X labels — adaptive to time span
      const spanDays = cumData.length > 1 ? (cumData[cumData.length-1].date - cumData[0].date) / 86400000 : 0;
      ctx.font='12px DM Mono,monospace'; ctx.fillStyle='#CDD2E0'; ctx.textAlign='center';
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const labeledX = [];
      if (spanDays > 90) {
        // Show months
        let lastMonth = -1;
        cumData.forEach((d,i) => {
          const m = d.date.getMonth();
          if (m !== lastMonth && i > 0) {
            labeledX.push({ i, label: months[m] });
            lastMonth = m;
          } else if (i === 0) lastMonth = m;
        });
      } else if (spanDays > 30) {
        // Show weeks
        let lastWeek = -1;
        cumData.forEach((d,i) => {
          const week = Math.floor(d.date.getTime() / (7*86400000));
          if (week !== lastWeek && i > 0) {
            labeledX.push({ i, label: (d.date.getMonth()+1) + '/' + d.date.getDate() });
            lastWeek = week;
          } else if (i === 0) lastWeek = week;
        });
      } else {
        // Show days
        const lStep = Math.max(1, Math.floor(cumData.length / 6));
        cumData.forEach((d,i) => {
          if ((i % lStep === 0 && i > 0) || i === cumData.length - 1) {
            labeledX.push({ i, label: (d.date.getMonth()+1) + '/' + d.date.getDate() });
          }
        });
      }
      labeledX.forEach(l => ctx.fillText(l.label, xP(l.i), H-6));

      // Monte Carlo bands (from trade 0)
      if (mcBands.length) {
        // P10-P90 band
        ctx.beginPath();
        for (var j = 0; j <= mcN; j++) ctx.lineTo(xP(j), yP(mcBands[j].p90));
        for (var j = mcN; j >= 0; j--) ctx.lineTo(xP(j), yP(mcBands[j].p10));
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,78,26,0.06)';
        ctx.fill();
        // P25-P75 band
        ctx.beginPath();
        for (var j = 0; j <= mcN; j++) ctx.lineTo(xP(j), yP(mcBands[j].p75));
        for (var j = mcN; j >= 0; j--) ctx.lineTo(xP(j), yP(mcBands[j].p25));
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,78,26,0.12)';
        ctx.fill();
        // Expected value line
        ctx.beginPath(); ctx.strokeStyle = '#FF4E1A'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
        for (var j = 0; j <= mcN; j++) { var ev = avgPerTrade * j; j===0 ? ctx.moveTo(xP(j), yP(ev)) : ctx.lineTo(xP(j), yP(ev)); }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Line segments colored by above/below zero
      ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
      for (let i = 1; i < cumData.length; i++) {
        const prev = cumData[i-1].cum, cur = cumData[i].cum;
        ctx.beginPath();
        ctx.moveTo(xP(i-1), yP(prev));
        ctx.lineTo(xP(i), yP(cur));
        ctx.strokeStyle = (prev >= 0 && cur >= 0) ? '#22C55E' : (prev < 0 && cur < 0) ? '#EF4444' : (cur >= 0 ? '#22C55E' : '#EF4444');
        ctx.stroke();
      }

      // Dots
      cumData.forEach((d,i) => {
        ctx.beginPath();
        ctx.arc(xP(i), yP(d.cum), 2.5, 0, Math.PI*2);
        ctx.fillStyle = d.cum >= 0 ? '#22C55E' : '#EF4444';
        ctx.fill();
      });

      // Tooltip
      canvas.onmousemove = function(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        let nearest = 0, minDist = Infinity;
        cumData.forEach(function(d,i) {
          var dx = mx - xP(i), dy = my - yP(d.cum);
          var dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < minDist) { minDist = dist; nearest = i; }
        });
        if (minDist > 15) { document.getElementById('eq-tooltip').style.display = 'none'; return; }
        var d = cumData[nearest];
        var tooltip = document.getElementById('eq-tooltip');
        if (!tooltip || !d) return;
        var dayLabel = fmtS(d.dayPnL);
        var wr = d.count ? Math.round(d.wins / d.count * 100) : 0;
        tooltip.innerHTML = '<div style="color:var(--text-3);margin-bottom:0.3rem">' + fmtDate2(d.date) + '</div>' +
          '<div style="color:var(--text-3)">Trades: <span style="color:var(--text-2)">' + d.count + '</span> (' + wr + '% WR)</div>' +
          '<div style="color:var(--text-3)">Day P&L: <span class="' + cls(d.dayPnL) + '">' + dayLabel + '</span></div>';
        tooltip.style.display = 'block';
        var tipW = 180;
        var left = mx + 16 + tipW > canvas.offsetWidth ? mx - tipW - 8 : mx + 16;
        tooltip.style.left = left + 'px';
        tooltip.style.top = (e.clientY - rect.top - 40) + 'px';
      };
      canvas.onmouseleave = function() { document.getElementById('eq-tooltip').style.display = 'none'; };
    }, 50);
  }

  loadData();
</script>
</body>
</html>
